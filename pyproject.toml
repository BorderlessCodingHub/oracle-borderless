[project]
name = "oracle-borderless"
version = "0.1.0"
description = "Oracle Borderless — agente de IA (oráculo) sobre base de conhecimento aprovada do Notion via MCP."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Framework HTTP
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # ORM (dual engine: async asyncpg + sync psycopg) + migrations
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    # Validação e settings
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # PK UUID v7
    "uuid6>=2024.7.10",
    # Scheduler distribuído (jobstore PostgreSQL)
    "apscheduler>=3.10,<4",
    # LLM — o oráculo pode usar Claude (Anthropic) ou GPT (OpenAI), selecionável via LLM_PROVIDER
    # Pisos = versões efetivamente testadas (lockfile), tetos no próximo major:
    # os pisos antigos (>=0.40, >=1.55, >=0.2, >=0.3, >=0.1) eram de majors
    # ANTERIORES aos que rodam aqui — uma resolução limpa podia instalar código
    # que nunca passou por teste nenhum neste projeto.
    "anthropic>=1.3,<2",
    "openai>=3.6,<4",
    "langgraph>=1.2,<2",
    "langchain-core>=1.6,<2",
    "langchain-anthropic>=1.7,<2",
    "langchain-openai>=1.6,<2",
    "langsmith>=0.12,<1",
    "pgvector>=0.4.2",
    "tavily-python>=0.7.26",
    # MCP (Model Context Protocol) — cliente usado por src/support/clients/notion/mcp_session.py.
    # Antes vinha transitivo via pydantic-ai; explicitado após a troca para LangGraph.
    "mcp>=2.1,<3",
    # Autenticação (ADR-0018): bridge BFF com a plataforma
    "httpx>=0.27",
    # Protocolo AG-UI (ADR-0019): só tipos Pydantic + EventEncoder. A tradução
    # chunk -> evento mora em src/app/api/streaming/; domínio e grafo não importam.
    "ag-ui-protocol>=0.1,<1",
]

[project.scripts]
cli = "cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "testcontainers[postgres]>=4.8",
    "prospector>=1.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
py-modules = []
